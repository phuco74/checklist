<!doctype html>
<!--
================================================================================
  중대재해 안전점검 시스템 - 1단계: 로그인

  [설정 순서]
  1. Supabase 프로젝트 생성
  2. Supabase > SQL Editor 에서 아래 "SUPABASE SETUP SQL" 전체를 붙여넣고 Run
  3. Supabase > Authentication > Users > "Add user" > "Create new user" 로 3명 생성
       - 이메일: 아이디@safety.local   (예: kim@safety.local, lee@safety.local)
       - 비밀번호: 원하는 비밀번호
       - "Auto Confirm User" 체크
     → 로그인 화면에서는 '@safety.local' 앞부분(kim)만 아이디로 입력합니다.
  4. 관리자로 지정할 사람은 SQL Editor 에서 실행:
       update public.profiles set role = 'admin' where username = 'kim';
  5. Supabase > Project Settings > API 에서
       Project URL, anon public key 를 복사해 아래 SUPABASE_URL, SUPABASE_ANON_KEY 에 넣기
  6. 이 파일을 GitHub 저장소에 index.html 로 올리고 Vercel 에서 Import → Deploy

  [SUPABASE SETUP SQL]
  ------------------------------------------------------------------------------
  -- 사용자 프로필 (아이디, 이름, 권한)
  create table public.profiles (
    id           uuid primary key references auth.users(id) on delete cascade,
    username     text unique not null,
    display_name text,
    role         text not null default 'user' check (role in ('admin', 'user')),
    created_at   timestamptz not null default now()
  );

  -- 관리자 여부 확인 함수 (RLS 정책에서 사용)
  create or replace function public.is_admin()
  returns boolean
  language sql
  security definer
  set search_path = public
  stable
  as $$
    select exists (
      select 1 from public.profiles where id = auth.uid() and role = 'admin'
    );
  $$;

  -- 새 사용자가 생기면 프로필 자동 생성 (이메일 @ 앞부분을 아이디로 사용)
  create or replace function public.handle_new_user()
  returns trigger
  language plpgsql
  security definer
  set search_path = public
  as $$
  begin
    insert into public.profiles (id, username, display_name)
    values (new.id, split_part(new.email, '@', 1), split_part(new.email, '@', 1));
    return new;
  end;
  $$;

  create trigger on_auth_user_created
    after insert on auth.users
    for each row execute function public.handle_new_user();

  -- 권한: 본인 프로필만 조회, 관리자는 전체 조회
  alter table public.profiles enable row level security;

  create policy "본인 또는 관리자 조회" on public.profiles
    for select using (id = auth.uid() or public.is_admin());

  create policy "관리자만 수정" on public.profiles
    for update using (public.is_admin());
  ------------------------------------------------------------------------------
================================================================================
-->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>안전점검 시스템</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #6b7385;
      --line: #dde2ea;
      --primary: #d9480f;
      --primary-dark: #b53d0c;
      --error-bg: #fdecec;
      --error: #c0392b;
      --admin: #1c7ed6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }
    .hidden { display: none !important; }

    /* 로그인 화면 */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand .icon {
      width: 48px; height: 48px; margin: 0 auto 12px;
      border-radius: 12px; background: var(--primary); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 700;
    }
    .brand h1 { margin: 0; font-size: 20px; }
    .brand p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 14px; font-weight: 600; margin: 16px 0 6px; }
    input {
      width: 100%; padding: 11px 12px; font-size: 15px;
      border: 1px solid var(--line); border-radius: 8px; outline: none;
    }
    input:focus { border-color: var(--primary); }
    button {
      cursor: pointer; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600;
    }
    .btn-primary {
      width: 100%; margin-top: 24px; padding: 12px;
      background: var(--primary); color: #fff;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }
    .msg {
      margin-top: 16px; padding: 10px 12px; border-radius: 8px;
      font-size: 14px; background: var(--error-bg); color: var(--error);
    }

    /* 로그인 후 화면 */
    header {
      background: var(--card); border-bottom: 1px solid var(--line);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    header .title { font-weight: 700; }
    header .user { display: flex; align-items: center; gap: 10px; font-size: 14px; }
    .badge {
      font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
      background: var(--line); color: var(--muted);
    }
    .badge.admin { background: #e7f1fb; color: var(--admin); }
    .btn-ghost {
      padding: 7px 12px; background: transparent;
      border: 1px solid var(--line); color: var(--text); font-size: 14px;
    }
    main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }
    .panel {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 24px;
    }
    .panel h2 { margin: 0 0 8px; font-size: 18px; }
    .panel p { margin: 0; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
  </style>
</head>
<body>

  <!-- 로그인 화면 -->
  <div id="login-view" class="login-wrap hidden">
    <form id="login-form" class="login-card">
      <div class="brand">
        <div class="icon">!</div>
        <h1>중대재해 안전점검</h1>
        <p>일일 점검 및 주간보고 시스템</p>
      </div>

      <label for="username">아이디</label>
      <input id="username" autocomplete="username" required />

      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" required />

      <button id="login-btn" type="submit" class="btn-primary">로그인</button>
      <div id="login-msg" class="msg hidden"></div>
    </form>
  </div>

  <!-- 로그인 후 화면 -->
  <div id="app-view" class="hidden">
    <header>
      <div class="title">중대재해 안전점검</div>
      <div class="user">
        <span id="user-name"></span>
        <span id="user-role" class="badge"></span>
        <button id="logout-btn" class="btn-ghost">로그아웃</button>
      </div>
    </header>

    <main>
      <!-- 일반 사용자 / 관리자 공통: 내 점검 (다음 단계에서 체크리스트 추가) -->
      <section class="panel">
        <h2>오늘의 점검</h2>
        <p>체크리스트는 다음 단계에서 추가됩니다.</p>
      </section>

      <!-- 관리자 전용: 전체 사용자 -->
      <section id="admin-panel" class="panel hidden" style="margin-top: 16px;">
        <h2>전체 사용자 (관리자)</h2>
        <p>모든 기록자의 점검 데이터는 다음 단계에서 이곳에 취합됩니다.</p>
        <table>
          <thead><tr><th>아이디</th><th>이름</th><th>권한</th></tr></thead>
          <tbody id="user-table"></tbody>
        </table>
      </section>
    </main>
  </div>

  <script>
    // ===== Supabase 설정: 본인 프로젝트 값으로 교체 =====
    const SUPABASE_URL = "https://tiaufjnflbctnwluwnpy.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpYXVmam5mbGJjdG53bHV3bnB5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4MTE2MDUsImV4cCI6MjEwODM4NzYwNX0.SviQxQHtONBsGUBRhPXGa1ekve2w9aPeCAdv32B-LDU";
    // 아이디 → 로그인 이메일 변환에 쓰는 도메인 (Supabase 사용자 생성 시 동일하게 사용)
    const ID_DOMAIN = "safety.local";

    const $ = (id) => document.getElementById(id);
    const configured = !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_ANON_KEY.includes("YOUR-");
    const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    function showMessage(text) {
      $("login-msg").textContent = text;
      $("login-msg").classList.toggle("hidden", !text);
    }

    function showLogin() {
      $("app-view").classList.add("hidden");
      $("login-view").classList.remove("hidden");
      $("password").value = "";
    }

    async function showApp(user) {
      const { data: profile, error } = await sb
        .from("profiles")
        .select("username, display_name, role")
        .eq("id", user.id)
        .single();

      if (error || !profile) {
        await sb.auth.signOut();
        showLogin();
        showMessage("사용자 프로필을 찾을 수 없습니다. 관리자에게 문의하세요.");
        return;
      }

      const isAdmin = profile.role === "admin";
      $("user-name").textContent = profile.display_name || profile.username;
      $("user-role").textContent = isAdmin ? "관리자" : "기록자";
      $("user-role").classList.toggle("admin", isAdmin);
      $("admin-panel").classList.toggle("hidden", !isAdmin);
      if (isAdmin) await loadUsers();

      $("login-view").classList.add("hidden");
      $("app-view").classList.remove("hidden");
    }

    async function loadUsers() {
      const { data, error } = await sb
        .from("profiles")
        .select("username, display_name, role")
        .order("username");
      const tbody = $("user-table");
      tbody.innerHTML = "";
      if (error) return;
      for (const p of data) {
        const tr = document.createElement("tr");
        for (const v of [p.username, p.display_name || "-", p.role === "admin" ? "관리자" : "기록자"]) {
          const td = document.createElement("td");
          td.textContent = v;
          tr.appendChild(td);
        }
        tbody.appendChild(tr);
      }
    }

    $("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      showMessage("");
      if (!configured) {
        showMessage("Supabase 설정이 필요합니다. 코드 상단의 SUPABASE_URL과 SUPABASE_ANON_KEY를 입력하세요.");
        return;
      }

      const username = $("username").value.trim().toLowerCase();
      const password = $("password").value;
      if (!/^[a-z0-9._-]+$/.test(username)) {
        showMessage("아이디는 영문 소문자, 숫자, . _ - 만 사용할 수 있습니다.");
        return;
      }

      $("login-btn").disabled = true;
      $("login-btn").textContent = "로그인 중...";
      const { data, error } = await sb.auth.signInWithPassword({
        email: `${username}@${ID_DOMAIN}`,
        password,
      });
      $("login-btn").disabled = false;
      $("login-btn").textContent = "로그인";

      if (error) {
        showMessage("아이디 또는 비밀번호가 올바르지 않습니다.");
        return;
      }
      await showApp(data.user);
    });

    $("logout-btn").addEventListener("click", async () => {
      await sb.auth.signOut();
      showLogin();
    });

    // 시작: 이미 로그인된 세션이 있으면 바로 앱 화면으로
    (async () => {
      if (!configured) {
        showLogin();
        showMessage("Supabase 설정이 필요합니다. 코드 상단의 SUPABASE_URL과 SUPABASE_ANON_KEY를 입력하세요.");
        return;
      }
      const { data } = await sb.auth.getSession();
      if (data.session) await showApp(data.session.user);
      else showLogin();
    })();
  </script>
</body>
</html>
